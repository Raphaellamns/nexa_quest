<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fffafd" />
    <title>Painel | Nexa Quest</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="area.css" />
    <script type="module" src="js/painel.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="Nexa Play — início"><span class="brand-name">nexa<span class="brand-play">play</span></span></a>
        <nav class="main-nav" aria-label="Navegação principal">
          <a class="nav-link active" href="painel.html" aria-current="page">Painel</a>
          <a class="nav-link" href="missoes.html">Missões</a>
          <a class="nav-link" href="index.html">Site</a>
        </nav>
        <div class="header-actions"><a class="btn btn-header" href="login.html" data-sair>Sair</a></div>
        <details class="mobile-menu">
          <summary aria-label="Menu de navegação">Menu</summary>
          <nav aria-label="Navegação para celular">
            <h2>Navegação</h2>
            <a href="painel.html" aria-current="page">Painel</a>
            <a href="missoes.html">Missões</a>
            <a href="index.html">Site</a>
            <a href="login.html" data-sair>Sair</a>
          </nav>
        </details>
      </div>
    </header>

    <main id="conteudo" class="page-main area-painel" tabindex="-1">
      <section class="container page-intro">
        <h1>Painel do Nexa Quest</h1>
        <p id="mensagem-perfil" class="mensagem" role="status"></p>
      </section>
      <section class="container section" id="perfil" hidden>
        <div class="card painel-cartao perfil-cartao">
          <h2 id="nome-perfil"></h2>
          <p id="email-perfil" class="perfil-email"></p>
          <dl class="perfil-resumo">
            <div><dt>Nível</dt><dd id="nivel-perfil"></dd></div>
            <div><dt>Pontos</dt><dd id="pontos-perfil"></dd></div>
          </dl>
          <div class="actions">
            <a class="btn btn-primary" href="missoes.html">Ver missões</a>
          </div>
        </div>
      </section>
      <section class="container section" id="historico" hidden>
        <div class="card painel-cartao">
          <h2>Missões concluídas</h2>
          <p id="historico-vazio" hidden>Você ainda não concluiu nenhuma missão.</p>
          <ul id="lista-missoes-concluidas"></ul>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="rodape">
      <div class="container footer-inner">
        <div class="footer-brand"><h2>Nexa Play</h2><p>Jogos e experiências interativas.</p></div>
        <nav class="footer-links" aria-label="Links do rodapé">
          <h2>Links</h2>
          <div class="footer-link-grid">
            <a href="painel.html" aria-current="page">Painel</a>
            <a href="missoes.html">Missões</a>
            <a href="index.html">Site</a>
          </div>
        </nav>
      </div>
    </footer>
  </body>
</html>
